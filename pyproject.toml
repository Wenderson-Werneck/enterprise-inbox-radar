[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-inbox-radar"
version = "1.0.0"
description = "Automated corporate inbox triage, thread clustering, entity extraction, and SLA follow-up radar engine."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Wenderson Werneck", email = "cfpromlk@gmail.com"}
]
dependencies = [
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
